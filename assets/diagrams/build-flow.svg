<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build 트랙 플로우 — Discover, Design, Build, Release">
  <title>Build Track Flow</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-dn" markerWidth="8" markerHeight="10" refX="4" refY="8" orient="auto">
      <polyline points="1,1 4,9 7,1" fill="none" stroke="#0D1B6E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-faint" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- AI AGENT drop label -->
  <text x="558" y="22" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8.5" fill="#0D1B6E" font-weight="600" letter-spacing="1.5">AI AGENT</text>
  <line x1="558" y1="26" x2="558" y2="80" stroke="#0D1B6E" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr-dn)"/>

  <!-- Connection lines (behind nodes) -->
  <line x1="196" y1="150" x2="282" y2="150" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="406" y1="150" x2="492" y2="150" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="660" y="133" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.6" letter-spacing="0.5">EVAL HARNESS</text>
  <line x1="624" y1="150" x2="720" y2="150" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="856" y1="150" x2="940" y2="150" stroke="#0D1B6E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-faint)"/>
  <text x="960" y="145" text-anchor="start" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5">XCIPE.FLOW</text>
  <text x="960" y="158" text-anchor="start" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5">→ Opts Track</text>

  <!-- Node: Discover -->
  <circle cx="132" cy="150" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="132" y="146" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Discover</text>
  <text x="132" y="163" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">01</text>

  <!-- Node: Design -->
  <circle cx="344" cy="150" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="344" y="146" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Design</text>
  <text x="344" y="163" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">02</text>

  <!-- Node: Build (filled / active) -->
  <circle cx="558" cy="150" r="64" fill="#0D1B6E" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="558" y="146" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Build</text>
  <text x="558" y="163" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.45)">03</text>

  <!-- Node: Release -->
  <circle cx="788" cy="150" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="788" y="146" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Release</text>
  <text x="788" y="163" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">04</text>

  <!-- Sub-labels below nodes -->
  <text x="132" y="232" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.45">비즈니스 요구정의</text>
  <text x="344" y="232" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.45">아키텍처·UI 설계</text>
  <text x="558" y="232" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.45">AI 코딩 에이전트</text>
  <text x="788" y="232" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.45">평가 통과 배포</text>

  <!-- Bottom annotation -->
  <text x="50" y="285" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.3" letter-spacing="0.5">Build Track  ·  AI Implementation Methodology</text>
  <text x="850" y="285" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.3">Human in the loop</text>
</svg>
