<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-labelledby="opts-title opts-desc">
  <title id="opts-title">Opts 트랙 흐름도</title>
  <desc id="opts-desc">GROVI Opts 트랙의 3단계: Operate, Optimize, Analyze와 Update 루프 및 Agent 트랙 연결을 보여주는 흐름도</desc>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ADE80"/>
    </marker>
    <marker id="arrow-green-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4ADE80"/>
    </marker>
    <marker id="arrow-orange-sm" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FDBA74"/>
    </marker>
  </defs>

  <!-- Stage 1: Operate -->
  <rect x="30" y="30" width="260" height="130" rx="12" fill="rgba(22,163,74,0.15)" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="50" y="72" font-family="'Courier New', monospace" font-size="28" fill="#86EFAC" font-weight="700">01</text>
  <text x="50" y="100" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">OPERATE</text>
  <text x="50" y="122" font-family="sans-serif" font-size="12" fill="#94A3B8">서비스 운영 · 모니터링</text>
  <text x="50" y="140" font-family="sans-serif" font-size="12" fill="#94A3B8">인시던트 대응</text>

  <!-- Handoff label 1 -->
  <text x="305" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">운영</text>
  <text x="305" y="101" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">데이터</text>

  <!-- Arrow 1→2 -->
  <line x1="292" y1="95" x2="338" y2="95" stroke="#4ADE80" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Stage 2: Optimize -->
  <rect x="350" y="30" width="260" height="130" rx="12" fill="rgba(22,163,74,0.15)" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="370" y="72" font-family="'Courier New', monospace" font-size="28" fill="#86EFAC" font-weight="700">02</text>
  <text x="370" y="100" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">OPTIMIZE</text>
  <text x="370" y="122" font-family="sans-serif" font-size="12" fill="#94A3B8">성능 개선 · 비용 최적화</text>
  <text x="370" y="140" font-family="sans-serif" font-size="12" fill="#94A3B8">프로세스 효율화</text>

  <!-- Handoff label 2 -->
  <text x="625" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">인사이트</text>
  <text x="625" y="101" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">리포트</text>

  <!-- Arrow 2→3 -->
  <line x1="612" y1="95" x2="658" y2="95" stroke="#4ADE80" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Stage 3: Analyze -->
  <rect x="670" y="30" width="260" height="130" rx="12" fill="rgba(22,163,74,0.15)" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="690" y="72" font-family="'Courier New', monospace" font-size="28" fill="#86EFAC" font-weight="700">03</text>
  <text x="690" y="100" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">ANALYZE</text>
  <text x="690" y="122" font-family="sans-serif" font-size="12" fill="#94A3B8">데이터 분석 · 패턴 발견</text>
  <text x="690" y="140" font-family="sans-serif" font-size="12" fill="#94A3B8">전략적 의사결정</text>

  <!-- Branch arrow: Analyze → Agent track -->
  <line x1="930" y1="65" x2="990" y2="40" stroke="#FDBA74" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-orange-sm)"/>
  <text x="996" y="38" font-family="sans-serif" font-size="11" fill="#FDBA74">→ Agent 트랙</text>

  <!-- ─── UPDATE LOOP ─── -->
  <!-- Dashed curved path from Analyze (right) looping back to Operate (left) -->
  <path d="M 900,180 Q 550,255 160,180" fill="none" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#arrow-green-left)"/>

  <!-- Loop label -->
  <text x="530" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#86EFAC">Update 루프 → Discover · Design 환류</text>

</svg>
