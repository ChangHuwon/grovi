<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Opts 트랙 플로우 — Operate, Optimize, Analyze, Update 루프">
  <title>Opts Track Flow</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-left" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto">
      <polyline points="9,1 1,4 9,7" fill="none" stroke="#0D1B6E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-faint" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Connection lines -->
  <line x1="210" y1="140" x2="310" y2="140" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="140" x2="530" y2="140" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Agent branch label -->
  <text x="780" y="128" text-anchor="start" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.6">→ Agent Track</text>
  <line x1="726" y1="140" x2="820" y2="140" stroke="#0D1B6E" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-faint)"/>

  <!-- Node: Operate -->
  <circle cx="146" cy="140" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="146" y="136" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Operate</text>
  <text x="146" y="153" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">05</text>

  <!-- Node: Optimize -->
  <circle cx="370" cy="140" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="370" y="136" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Optimize</text>
  <text x="370" y="153" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">06</text>

  <!-- Node: Analyze (filled / active) -->
  <circle cx="662" cy="140" r="64" fill="#0D1B6E" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="662" y="136" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Analyze</text>
  <text x="662" y="153" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.45)">07</text>

  <!-- Update Loop dashed path: Analyze bottom → curve back → Operate bottom -->
  <path d="M 662,204 Q 662,258 404,268 Q 200,270 146,204" fill="none" stroke="#0D1B6E" stroke-width="1.2" stroke-dasharray="6 4" marker-start="url(#arr-left)"/>
  <text x="400" y="280" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8.5" fill="#0D1B6E" opacity="0.5">Update 루프 → Discover · Design 환류</text>

  <!-- Sub-labels -->
  <text x="146" y="222" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.45">운영 모니터링</text>
  <text x="370" y="222" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.45">성능 최적화</text>
  <text x="662" y="222" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#FFFFFF" opacity="0.5">데이터 분석</text>

  <!-- Bottom annotation -->
  <text x="50" y="296" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.3">Opts Track  ·  AI Operation Methodology</text>
</svg>
