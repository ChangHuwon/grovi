<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent 트랙 플로우 — 듀얼 진입과 Strategy, Design, Build, Deploy 4단계">
  <title>Agent Track Flow</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-dashed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1" opacity="0.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Entry 1: Analyze (from Opts) - top, solid -->
  <text x="30" y="88" font-family="'JetBrains Mono','Courier New',monospace" font-size="8.5" fill="#0D1B6E" font-weight="600">Analyze (Opts)</text>
  <text x="30" y="102" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5">기존 시스템 환류</text>
  <!-- Entry line 1 (solid) → merge point -->
  <line x1="148" y1="96" x2="220" y2="148" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Entry 2: Standalone - bottom, dashed -->
  <text x="30" y="220" font-family="'JetBrains Mono','Courier New',monospace" font-size="8.5" fill="#0D1B6E" font-weight="600">Standalone Project</text>
  <text x="30" y="234" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5">신규 프로젝트</text>
  <!-- Entry line 2 (dashed) → merge point -->
  <line x1="148" y1="224" x2="220" y2="172" stroke="#0D1B6E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/>

  <!-- Merge point (small filled circle) -->
  <circle cx="228" cy="160" r="7" fill="#0D1B6E"/>

  <!-- Merge → Strategy arrow -->
  <line x1="235" y1="160" x2="298" y2="160" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- AI AGENT label above connections between Design and Build -->
  <text x="660" y="100" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8.5" fill="#0D1B6E" opacity="0.65" font-weight="600">AI AGENT</text>
  <line x1="660" y1="104" x2="660" y2="90" stroke="#0D1B6E" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Node connections -->
  <line x1="436" y1="160" x2="526" y2="160" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="656" y1="160" x2="746" y2="160" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="876" y1="160" x2="966" y2="160" stroke="#0D1B6E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node: Strategy -->
  <circle cx="368" cy="160" r="68" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="368" y="156" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="700" fill="#0D1B6E">Strategy</text>
  <text x="368" y="172" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">01</text>

  <!-- Node: Design -->
  <circle cx="592" cy="160" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="592" y="156" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Design</text>
  <text x="592" y="172" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">02</text>

  <!-- Node: Build -->
  <circle cx="812" cy="160" r="64" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="812" y="156" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#0D1B6E">Build</text>
  <text x="812" y="172" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#0D1B6E" opacity="0.4">03</text>

  <!-- Node: Deploy (filled / active) -->
  <circle cx="1032" cy="160" r="64" fill="#0D1B6E" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="1032" y="151" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Deploy</text>
  <text x="1032" y="167" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="rgba(255,255,255,0.45)">04</text>

  <!-- Deploy: Shadow/Suggest/Act stack inside node -->
  <text x="1032" y="184" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="7" fill="rgba(255,255,255,0.5)">Shadow · Suggest · Act</text>

  <!-- Sub-labels -->
  <text x="368" y="250" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">전략·기획</text>
  <text x="592" y="242" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">도구·정책 설계</text>
  <text x="812" y="242" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">구현·검증</text>
  <text x="1032" y="242" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">점진적 배포</text>

  <!-- Bottom annotation -->
  <text x="50" y="310" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.3">Agent Track  ·  AI Agent Methodology</text>
</svg>
