<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 280" width="100%" role="img" aria-labelledby="agent-title agent-desc">
  <title id="agent-title">Agent 트랙 흐름도</title>
  <desc id="agent-desc">GROVI Agent 트랙의 이중 진입점과 4단계(Strategy, Design, Build, Deploy), Shadow/Suggest/Act 단계를 보여주는 흐름도</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FB923C"/>
    </marker>
    <marker id="arrow-green-entry" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ADE80"/>
    </marker>
    <marker id="arrow-orange-entry" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EA580C"/>
    </marker>
  </defs>

  <!-- ─── DUAL ENTRY ─── -->

  <!-- Entry 1: Analyze / 기존 시스템 환류 -->
  <rect x="20" y="30" width="165" height="75" rx="8" fill="rgba(22,163,74,0.1)" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="103" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#86EFAC" font-weight="600">Analyze (Opts)</text>
  <text x="103" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#86EFAC">기존 시스템 환류</text>
  <text x="103" y="91" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4ADE80">Opts 트랙에서 유입</text>

  <!-- Entry 2: Standalone / 신규 프로젝트 -->
  <rect x="20" y="145" width="165" height="75" rx="8" fill="rgba(234,88,12,0.1)" stroke="#EA580C" stroke-width="1.5"/>
  <text x="103" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FDBA74" font-weight="600">Standalone Project</text>
  <text x="103" y="189" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FDBA74">신규 프로젝트</text>
  <text x="103" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#EA580C">직접 진입</text>

  <!-- Merge point circle -->
  <circle cx="252" cy="110" r="9" fill="#EA580C" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="252" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">+</text>

  <!-- Lines from entries to merge point -->
  <line x1="185" y1="67" x2="243" y2="105" stroke="#4ADE80" stroke-width="1.5" marker-end="url(#arrow-green-entry)"/>
  <line x1="185" y1="182" x2="243" y2="115" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange-entry)"/>

  <!-- Merge → Stage 1 arrow -->
  <line x1="262" y1="110" x2="298" y2="110" stroke="#FB923C" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ─── 4 PHASE BOXES ─── -->

  <!-- Stage 1: Strategy -->
  <rect x="300" y="40" width="200" height="130" rx="12" fill="rgba(234,88,12,0.15)" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="320" y="84" font-family="'Courier New', monospace" font-size="28" fill="#FDBA74" font-weight="700">01</text>
  <text x="320" y="112" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">STRATEGY</text>
  <text x="320" y="134" font-family="sans-serif" font-size="12" fill="#94A3B8">목표 정의</text>
  <text x="320" y="150" font-family="sans-serif" font-size="12" fill="#94A3B8">에이전트 범위 설정</text>

  <!-- Arrow 1→2 -->
  <line x1="502" y1="105" x2="538" y2="105" stroke="#FB923C" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Stage 2: Design -->
  <rect x="540" y="40" width="200" height="130" rx="12" fill="rgba(234,88,12,0.15)" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="560" y="84" font-family="'Courier New', monospace" font-size="28" fill="#FDBA74" font-weight="700">02</text>
  <text x="560" y="112" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">DESIGN</text>
  <text x="560" y="134" font-family="sans-serif" font-size="12" fill="#94A3B8">에이전트 아키텍처</text>
  <text x="560" y="150" font-family="sans-serif" font-size="12" fill="#94A3B8">툴 · 메모리 설계</text>

  <!-- Arrow 2→3 -->
  <line x1="742" y1="105" x2="778" y2="105" stroke="#FB923C" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Stage 3: Build -->
  <rect x="780" y="40" width="200" height="130" rx="12" fill="rgba(234,88,12,0.15)" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="800" y="84" font-family="'Courier New', monospace" font-size="28" fill="#FDBA74" font-weight="700">03</text>
  <text x="800" y="112" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">BUILD</text>
  <text x="800" y="134" font-family="sans-serif" font-size="12" fill="#94A3B8">에이전트 개발</text>
  <text x="800" y="150" font-family="sans-serif" font-size="12" fill="#94A3B8">통합 · 검증</text>

  <!-- Arrow 3→4 -->
  <line x1="982" y1="105" x2="1018" y2="105" stroke="#FB923C" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Stage 4: Deploy -->
  <rect x="1020" y="40" width="220" height="130" rx="12" fill="rgba(234,88,12,0.15)" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="1040" y="84" font-family="'Courier New', monospace" font-size="28" fill="#FDBA74" font-weight="700">04</text>
  <text x="1040" y="112" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" letter-spacing="1">DEPLOY</text>
  <text x="1040" y="134" font-family="sans-serif" font-size="12" fill="#94A3B8">에이전트 배포</text>

  <!-- Shadow / Suggest / Act stacked labels inside Deploy -->
  <rect x="1040" y="148" width="180" height="14" rx="3" fill="rgba(234,88,12,0.2)"/>
  <text x="1050" y="159" font-family="'Courier New', monospace" font-size="10" fill="#FDBA74" font-weight="600">Shadow → Suggest → Act</text>

</svg>
