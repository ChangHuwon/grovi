<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GROVI 프레임워크 — Build, Opts, Agent 3트랙 전체 구조">
  <title>GROVI Framework Overview</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polyline points="1,1 9,4 1,7" fill="none" stroke="#0D1B6E" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-dn" markerWidth="8" markerHeight="10" refX="4" refY="8" orient="auto">
      <polyline points="1,1 4,9 7,1" fill="none" stroke="#0D1B6E" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-up" markerWidth="8" markerHeight="10" refX="4" refY="2" orient="auto">
      <polyline points="1,9 4,1 7,9" fill="none" stroke="#0D1B6E" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
    <marker id="arr-lt" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto">
      <polyline points="9,1 1,4 9,7" fill="none" stroke="#0D1B6E" stroke-width="1" opacity="0.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Track band labels (left) -->
  <text x="28" y="114" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5" font-weight="700" letter-spacing="2">/ BUILD</text>
  <text x="28" y="234" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5" font-weight="700" letter-spacing="2">/ OPTS</text>
  <text x="28" y="354" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#0D1B6E" opacity="0.5" font-weight="700" letter-spacing="2">/ AGENT</text>

  <!-- Thin horizontal track dividers -->
  <line x1="90" y1="175" x2="1180" y2="175" stroke="#0D1B6E" stroke-width="0.5" opacity="0.15"/>
  <line x1="90" y1="295" x2="1180" y2="295" stroke="#0D1B6E" stroke-width="0.5" opacity="0.15"/>

  <!-- ──── BUILD TRACK ──── -->
  <!-- Node: Discover -->
  <circle cx="180" cy="120" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="180" y="116" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Discover</text>
  <text x="180" y="131" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">01</text>

  <line x1="224" y1="120" x2="296" y2="120" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node: Design -->
  <circle cx="340" cy="120" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="340" y="116" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Design</text>
  <text x="340" y="131" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">02</text>

  <line x1="384" y1="120" x2="456" y2="120" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node: Build (filled) -->
  <circle cx="500" cy="120" r="44" fill="#0D1B6E" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="500" y="116" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Build</text>
  <text x="500" y="131" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="rgba(255,255,255,0.4)">03</text>

  <line x1="544" y1="120" x2="616" y2="120" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node: Release -->
  <circle cx="660" cy="120" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="660" y="116" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Release</text>
  <text x="660" y="131" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">04</text>

  <!-- Release → Operate cross-track arrow -->
  <line x1="660" y1="164" x2="660" y2="185" stroke="#0D1B6E" stroke-width="1" opacity="0.3" stroke-dasharray="4 3"/>
  <line x1="660" y1="185" x2="186" y2="185" stroke="#0D1B6E" stroke-width="1" opacity="0.3" stroke-dasharray="4 3"/>
  <line x1="186" y1="185" x2="186" y2="196" stroke="#0D1B6E" stroke-width="1" opacity="0.3" marker-end="url(#arr-dn)"/>

  <!-- ──── OPTS TRACK ──── -->
  <!-- Node: Operate -->
  <circle cx="186" cy="240" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="186" y="236" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Operate</text>
  <text x="186" y="251" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">05</text>

  <line x1="230" y1="240" x2="296" y2="240" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node: Optimize -->
  <circle cx="340" cy="240" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="340" y="236" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Optimize</text>
  <text x="340" y="251" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">06</text>

  <line x1="384" y1="240" x2="456" y2="240" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node: Analyze -->
  <circle cx="500" cy="240" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="500" y="236" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Analyze</text>
  <text x="500" y="251" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">07</text>

  <!-- Analyze → Agentize downward arrow -->
  <line x1="500" y1="284" x2="500" y2="310" stroke="#0D1B6E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-dn)"/>

  <!-- Update Loop: Analyze → back to Discover/Design -->
  <path d="M 500,284 Q 500,390 340,400 Q 200,408 180,284" fill="none" stroke="#0D1B6E" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" marker-start="url(#arr-lt)"/>
  <text x="340" y="412" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.4">Update 루프</text>

  <!-- ──── AGENT TRACK ──── -->
  <!-- Standalone entry arrow -->
  <line x1="820" y1="50" x2="820" y2="80" stroke="#0D1B6E" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" marker-end="url(#arr-dn)"/>
  <text x="830" y="42" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.5">Standalone Project</text>

  <!-- Node: Agentize -->
  <circle cx="500" cy="360" r="44" fill="none" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="500" y="356" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#0D1B6E">Agentize</text>
  <text x="500" y="371" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#0D1B6E" opacity="0.4">08</text>

  <!-- Agentize → Agent phases (Strategy/Design/Build/Deploy condensed) -->
  <line x1="544" y1="360" x2="650" y2="360" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="710" y="348" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="10" font-weight="600" fill="#0D1B6E">Strategy</text>
  <text x="710" y="362" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.4">→ Design → Build → Deploy</text>
  <line x1="820" y1="84" x2="820" y2="340" stroke="#0D1B6E" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="820" y1="340" x2="750" y2="358" stroke="#0D1B6E" stroke-width="1.2" opacity="0.5" marker-end="url(#arr)"/>

  <!-- Node: Deploy (filled) -->
  <circle cx="1040" cy="360" r="44" fill="#0D1B6E" stroke="#0D1B6E" stroke-width="1.5"/>
  <text x="1040" y="356" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Deploy</text>
  <text x="1040" y="371" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Shadow·Suggest·Act</text>
  <line x1="760" y1="360" x2="996" y2="360" stroke="#0D1B6E" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- / BUILD / OPTS / AGENT annotations (top) -->
  <text x="180" y="52" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.35">AI 구축방법론</text>
  <text x="1120" y="114" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.35">/ BUILD</text>
  <text x="1120" y="234" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.35">/ OPTS</text>
  <text x="1120" y="354" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#0D1B6E" opacity="0.35">/ AGENT</text>
</svg>
